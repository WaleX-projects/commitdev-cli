name: Build Cross-Platform CLI

on:
  push:
    tags:
      - 'v*' # Triggers when you create a version tag like v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: commitdev-linux
          - os: macos-latest
            asset_name: commitdev-macos
          - os: windows-latest
            asset_name: commitdev-windows.exe

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install All Dependencies
      run: |
        python -m pip install --upgrade pip
        # Included Pillow and rich-pixels so your inline image rendering system works natively
        pip install pyinstaller typer requests websockets python-dotenv Pillow rich-pixels

    - name: Build Binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile --add-data "commitdev/hooks:commitdev/hooks" commitdev/main.py --name ${{ matrix.asset_name }}
        chmod +x dist/${{ matrix.asset_name }}

    - name: Build Binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --add-data "commitdev/hooks;commitdev/hooks" commitdev/main.py --name ${{ matrix.asset_name }}

    - name: Stage Artifact for Assembly
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}

  