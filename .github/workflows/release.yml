name: Build Cross-Platform CLI

on:
  push:
    tags:
      - 'v*' # Triggers on ANY version tag style (e.g., 1.1.4 or v1.1.4)

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: commitdev-linux
          - os: macos-latest
            asset_name: commitdev-macos
          - os: windows-latest
            asset_name: commitdev-windows.exe

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install All Dependencies
      run: |
        python -m pip install --upgrade pip
        # Included Pillow and rich-pixels so your inline image rendering system works natively
        pip install pyinstaller typer requests websockets python-dotenv Pillow rich-pixels setuptools setuptools-scm
        
    - name: Build Binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile --additional-hooks-dir="commitdev/hooks" --hidden-import="rich_pixels"  --hidden-import="commitdev.commands.analytics" --hidden-import="commitdev.commands.auth"  --hidden-import="commitdev.commands.drafts" --hidden-import="commitdev.commands.drafter" --hidden-import="commitdev.commands.integrations"  --hidden-import="commitdev.commands.posts" --hidden-import="commitdev.commands.repos"  --hidden-import="commitdev.commands.setup" --hidden-import="commitdev.commands.status" --add-data "commitdev/hooks:commitdev/hooks"  commitdev/main.py --name ${{ matrix.asset_name }} chmod +x dist/${{ matrix.asset_name }}

    - name: Build Binary (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        pyinstaller  --onefile --additional-hooks-dir="commitdev/hooks"  --hidden-import="rich_pixels"  --hidden-import="commitdev.commands.analytics"   --hidden-import="commitdev.commands.auth" --hidden-import="commitdev.commands.drafts"  --hidden-import="commitdev.commands.drafter"   --hidden-import="commitdev.commands.integrations"   --hidden-import="commitdev.commands.posts"  --hidden-import="commitdev.commands.repos"   --hidden-import="commitdev.commands.setup"  --hidden-import="commitdev.commands.status" --add-data "commitdev/hooks;commitdev/hooks"   commitdev/main.py  --name ${{ matrix.asset_name }}

    - name: Stage Artifact for Assembly
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}

  release:
    name: Create Production Release Page
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants explicit permissions to generate release pages
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Compiled Assets
      uses: actions/download-artifact@v4
      with:
        path: distribution_vault

    - name: Assemble Release Assets
      run: |
        mkdir -p dist_final

        # Collect compiled binaries from all build runners
        find distribution_vault -type f -exec mv {} dist_final/ \;

        # Include installer scripts
        [ -f install.sh ] && cp install.sh dist_final/
        [ -f install.ps1 ] && cp install.ps1 dist_final/

        echo "Release contents:"
        ls -lah dist_final

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          dist_final/commitdev-linux \
          dist_final/commitdev-macos \
          dist_final/commitdev-windows.exe \
          dist_final/install.sh \
          dist_final/install.ps1 \
          --title "CommitDev CLI ${{ github.ref_name }}" \
          --notes "Official CommitDev CLI release for Linux, macOS, and Windows."
