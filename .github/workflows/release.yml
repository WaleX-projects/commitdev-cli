name: Build Cross-Platform CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: commitdev-linux
          - os: macos-latest
            asset: commitdev-macos
          - os: windows-latest
            asset: commitdev-windows.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller
          pip install .

      - name: Verify Project Structure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pwd
          ls -la
          find commitdev -type f

      - name: Verify Project Structure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem commitdev -Recurse

      - name: Build Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --collect-all commitdev \
            --collect-submodules commitdev \
            --hidden-import commitdev.commands.auth \
            --hidden-import commitdev.commands.status \
            --hidden-import commitdev.commands.drafts \
            --hidden-import commitdev.commands.posts \
            --hidden-import commitdev.commands.repos \
            --hidden-import commitdev.commands.analytics \
            --hidden-import commitdev.commands.integrations \
            --hidden-import commitdev.commands.setup \
            --add-data "commitdev/hooks:commitdev/hooks" \
            --name "${{ matrix.asset }}" \
            commitdev/main.py

      - name: Build Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --collect-all commitdev `
            --collect-submodules commitdev `
            --hidden-import commitdev.commands.auth `
            --hidden-import commitdev.commands.status `
            --hidden-import commitdev.commands.drafts `
            --hidden-import commitdev.commands.posts `
            --hidden-import commitdev.commands.repos `
            --hidden-import commitdev.commands.analytics `
            --hidden-import commitdev.commands.integrations `
            --hidden-import commitdev.commands.setup `
            --add-data "commitdev/hooks;commitdev/hooks" `
            --name "${{ matrix.asset }}" `
            commitdev/main.py

      - name: Show PyInstaller Warnings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          find build -name "warn-*.txt" -exec cat {} \; || true

      - name: Show PyInstaller Warnings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Filter "warn-*.txt" | Get-Content

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Release
        run: |
          mkdir release

          find artifacts -type f -exec cp {} release/ \;

          if [ -f install.sh ]; then
            cp install.sh release/
          fi

          if [ -f install.ps1 ]; then
            cp install.ps1 release/
          fi

          echo "Release Files:"
          ls -lah release

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --title "CommitDev ${{ github.ref_name }}" \
            --notes "Official CommitDev CLI Release"