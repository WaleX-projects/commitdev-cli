name: Build Cross-Platform CLI

on:
  push:
    tags:
      - 'v*' # Triggers when you create a version tag like v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # FORCES GITHUB TO ALLOW CREATING AND WRITING RELEASES
    permissions:
      contents: write
      
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: commitdev-linux
          - os: macos-latest
            asset_name: commitdev-macos
          - os: windows-latest
            asset_name: commitdev-windows.exe

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install All Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller typer requests websockets google-genai openai python-dotenv

    - name: Build Binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile --add-data "commitdev/hooks:commitdev/hooks" commitdev/main.py --name ${{ matrix.asset_name }}
        chmod +x dist/${{ matrix.asset_name }}

    - name: Build Binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --add-data "commitdev/hooks;commitdev/hooks" commitdev/main.py --name ${{ matrix.asset_name }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/${{ matrix.asset_name }}
          install.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
