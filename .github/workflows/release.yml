name: Build Cross-Platform CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: commitdev-linux
            separator: ":"

          - os: macos-latest
            asset_name: commitdev-macos
            separator: ":"

          - os: windows-latest
            asset_name: commitdev-windows.exe
            separator: ";"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Build Dependencies
        run: |
          pip install \
            pyinstaller \
            typer \
            requests \
            websockets \
            python-dotenv \
            Pillow \
            rich-pixels \
            setuptools \
            setuptools-scm

      - name: Install CommitDev Package
        run: |
          pip install .

      - name: Show Repository Structure
        run: |
          echo "==== Repository Files ===="
          find commitdev -type f

      - name: Build Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --collect-submodules commitdev \
            --add-data "commitdev/hooks${{ matrix.separator }}commitdev/hooks" \
            --name "${{ matrix.asset_name }}" \
            commitdev/main.py

          chmod +x dist/${{ matrix.asset_name }}

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --collect-submodules commitdev `
            --add-data "commitdev/hooks;commitdev/hooks" `
            --name "${{ matrix.asset_name }}" `
            commitdev/main.py

      - name: Show PyInstaller Warnings
        if: always()
        run: |
          find build -name "warn-*.txt" -exec cat {} \; || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Release
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;

          cp install.sh release/
          cp install.ps1 release/

          echo "==== Release Files ===="
          ls -lah release

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/commitdev-linux \
            release/commitdev-macos \
            release/commitdev-windows.exe \
            release/install.sh \
            release/install.ps1 \
            --title "CommitDev CLI ${{ github.ref_name }}" \
            --notes "Official CommitDev CLI release for Linux, macOS, and Windows."