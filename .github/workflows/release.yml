name: Build Cross-Platform CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: commitdev-linux

          - os: macos-latest
            asset: commitdev-macos

          - os: windows-latest
            asset: commitdev-windows.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install pyinstaller
          pip install Pillow
          pip install rich-pixels
          pip install typer
          pip install requests
          pip install websockets
          pip install python-dotenv
          pip install setuptools
          pip install setuptools-scm

      - name: Install CommitDev
        run: |
          pip install .

      # -------------------------
      # Debug (Linux/macOS)
      # -------------------------
      - name: Show Project Files (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "===== Project Structure ====="
          find commitdev -type f

      # -------------------------
      # Debug (Windows)
      # -------------------------
      - name: Show Project Files (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "===== Project Structure ====="
          Get-ChildItem commitdev -Recurse

      # -------------------------
      # Build Linux/macOS
      # -------------------------
      - name: Build Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --collect-submodules commitdev \
            --add-data "commitdev/hooks:commitdev/hooks" \
            --name "${{ matrix.asset }}" \
            commitdev/main.py

          chmod +x dist/${{ matrix.asset }}

      # -------------------------
      # Build Windows
      # -------------------------
      - name: Build Binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --collect-submodules commitdev `
            --add-data "commitdev/hooks;commitdev/hooks" `
            --name "${{ matrix.asset }}" `
            commitdev/main.py

      # -------------------------
      # PyInstaller warnings (Linux/macOS)
      # -------------------------
      - name: Show PyInstaller Warnings (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: |
          find build -name "warn-*.txt" -exec cat {} \; || true

      # -------------------------
      # PyInstaller warnings (Windows)
      # -------------------------
      - name: Show PyInstaller Warnings (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $files = Get-ChildItem build -Recurse -Filter "warn-*.txt" -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            Write-Host ""
            Write-Host "===== $($file.FullName) ====="
            Get-Content $file.FullName
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Release
        run: |
          mkdir release

          find artifacts -type f -exec cp {} release/ \;

          cp install.sh release/
          cp install.ps1 release/

          echo "===== Release Files ====="
          ls -lah release

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/commitdev-linux \
            release/commitdev-macos \
            release/commitdev-windows.exe \
            release/install.sh \
            release/install.ps1 \
            --title "CommitDev CLI ${{ github.ref_name }}" \
            --notes "Official CommitDev CLI release."