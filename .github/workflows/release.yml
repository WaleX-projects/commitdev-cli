name: Build Cross-Platform CLI

on:
  push:
    tags:
      - 'v*' # Triggers on any version tag (e.g., v1.0.0, v1.1.4-beta)

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: commitdev-linux
            sep: ":"
          - os: macos-latest
            asset_name: commitdev-macos
            sep: ":"
          - os: windows-latest
            asset_name: commitdev-windows.exe
            sep: ";"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller typer requests websockets python-dotenv Pillow rich-pixels setuptools setuptools-scm

    - name: Compile Executable via PyInstaller
      run: >
        pyinstaller
        --onefile
        --collect-submodules commitdev
        --add-data "commitdev/hooks${{ matrix.sep }}commitdev/hooks"
        --name "${{ matrix.asset_name }}"
        commitdev/main.py

    - name: Ensure Executable Permissions (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: chmod +x "dist/${{ matrix.asset_name }}"

    - name: Upload Compiled Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}
        retention-days: 2

  release:
    name: Publish Production Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download All Built Artifacts
      uses: actions/download-artifact@v4
      with:
        path: distribution_vault

    - name: Consolidate Release Assets
      run: |
        mkdir -p dist_final
        
        # Flatten downloaded artifacts directly into the final delivery folder
        find distribution_vault -type f -exec mv {} dist_final/ \;
        
        # Safely include helper installer scripts if present
        for script in install.sh install.ps1; do
          if [ -f "$script" ]; then
            cp "$script" dist_final/
            echo "Staged installer: $script"
          fi
        done

        echo "--- Final Release Payload ---"
        ls -lah dist_final

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Generates a clean release page and automatically attaches everything inside the final directory
        gh release create "${{ github.ref_name }}" \
          dist_final/* \
          --title "CommitDev CLI ${{ github.ref_name }}" \
          --notes "Official cross-platform distribution binaries and setup scripts for CommitDev CLI."
