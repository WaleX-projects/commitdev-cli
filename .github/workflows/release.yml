name: Build Cross-Platform CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: commitdev-linux
            data_sep: ":"

          - os: macos-latest
            asset_name: commitdev-macos
            data_sep: ":"

          - os: windows-latest
            asset_name: commitdev-windows.exe
            data_sep: ";"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pip install .

      - name: Show Repository Structure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "===== Repository ====="
          find commitdev -type f

      - name: Show Repository Structure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "===== Repository ====="
          Get-ChildItem commitdev -Recurse

      - name: Build Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --collect-submodules commitdev \
            --collect-all commitdev \
            --add-data "commitdev/hooks${{ matrix.data_sep }}commitdev/hooks" \
            --name "${{ matrix.asset_name }}" \
            commitdev/main.py

          chmod +x dist/${{ matrix.asset_name }}

      - name: Build Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --collect-submodules commitdev `
            --collect-all commitdev `
            --add-data "commitdev/hooks;commitdev/hooks" `
            --name "${{ matrix.asset_name }}" `
            commitdev/main.py

      - name: Display PyInstaller Warnings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          find build -name "warn-*.txt" -exec cat {} \; || true

      - name: Display PyInstaller Warnings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Filter "warn-*.txt" | Get-Content

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: distribution_vault

      - name: Assemble Release Assets
        run: |
          mkdir -p release

          echo "Copying compiled binaries..."
          find distribution_vault -type f -exec cp {} release/ \;

          echo "Copying installer scripts..."

          if [ -f install.sh ]; then
            cp install.sh release/
          else
            echo "install.sh not found"
          fi

          if [ -f install.ps1 ]; then
            cp install.ps1 release/
          else
            echo "install.ps1 not found"
          fi

          echo ""
          echo "=============================="
          echo "Release Contents"
          echo "=============================="
          ls -lah release

      - name: Verify Release Assets
        run: |
          test -f release/commitdev-linux
          test -f release/commitdev-macos
          test -f release/commitdev-windows.exe

      - name: Delete Existing Release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/commitdev-linux \
            release/commitdev-macos \
            release/commitdev-windows.exe \
            release/install.sh \
            release/install.ps1 \
            --title "CommitDev CLI ${{ github.ref_name }}" \
            --notes "Official CommitDev CLI release for Linux, macOS, and Windows."