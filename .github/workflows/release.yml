name: Build Cross-Platform CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: commitdev-linux

          - os: macos-latest
            asset: commitdev-macos

          - os: windows-latest
            asset: commitdev-windows.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      ####################################################
      # LINUX + MACOS
      ####################################################
      - name: Install Dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip

          pip install \
            pyinstaller \
            typer \
            requests \
            websockets \
            python-dotenv \
            Pillow \
            rich-pixels \
            setuptools \
            setuptools-scm

          pip install .

      - name: Build Binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --collect-submodules commitdev \
            --add-data "commitdev/hooks:commitdev/hooks" \
            --name "${{ matrix.asset }}" \
            commitdev/main.py

          chmod +x dist/${{ matrix.asset }}

      ####################################################
      # WINDOWS
      ####################################################
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            pyinstaller `
            typer `
            requests `
            websockets `
            python-dotenv `
            Pillow `
            rich-pixels `
            setuptools `
            setuptools-scm

          python -m pip install .

      - name: Build Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --collect-submodules commitdev `
            --add-data "commitdev/hooks;commitdev/hooks" `
            --name "${{ matrix.asset }}" `
            commitdev/main.py

      ####################################################
      # DEBUG
      ####################################################
      - name: Show PyInstaller warnings (Linux/macOS)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          find build -name "warn-*.txt" -exec cat {} \; || true

      - name: Show PyInstaller warnings (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Filter "warn-*.txt" |
          ForEach-Object {
            Write-Host "----- $($_.FullName) -----"
            Get-Content $_.FullName
          }

      ####################################################
      # UPLOAD
      ####################################################
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble Release
        shell: bash
        run: |
          mkdir release

          find artifacts -type f -exec cp {} release/ \;

          if [ -f install.sh ]; then
            cp install.sh release/
          fi

          if [ -f install.ps1 ]; then
            cp install.ps1 release/
          fi

          echo "Release contents:"
          ls -lah release

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true

          gh release create "${{ github.ref_name }}" \
            release/commitdev-linux \
            release/commitdev-macos \
            release/commitdev-windows.exe \
            release/install.sh \
            release/install.ps1 \
            --title "CommitDev CLI ${{ github.ref_name }}" \
            --notes "Official CommitDev CLI release for Linux, macOS and Windows."